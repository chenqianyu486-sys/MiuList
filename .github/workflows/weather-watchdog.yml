name: Weather Freshness Watchdog

# 这个工作流**不抓天气**（那是 weather-sync 的活），它只回答一个带两问的问题：
# 「现在这份 weather.json，客户端用得**上**吗？」
#
#   * 这份数据有**多旧** —— 文件自带的 `lastUpdated` 距今 ≤ 3 小时；
#   * 这份数据是**哪一天的** —— 文件里的 `date` 是今天（北京时区）。
#
# ## 为什么需要它
#
# GitHub 的定时任务在高峰期会**跳过整点** —— 实测 93 次调度，平均间隔
# 4.45 小时、最长 10.77 小时，而 cron 写的是每小时一次。
# 于是「声明每小时」与「实际多久一次」是两回事，而且**没有任何信号**说
# 「这份天气还能不能用」。
#
# 客户端那边已经改成了「按文件自己的 `lastUpdated` 判新鲜度」
# （见 `SeniverseWeatherSource`），所以文件一旦停更，App 拿到的是一份
# 越来越旧的数据 —— 而界面上看不出区别。
#
# ## 为什么第二问不能省（2026-11-04 补）
#
# 客户端的 `WeatherService` 是**两把尺**：年龄 < 3 小时，**并且** `date` 是今天
# （`cachedToday()` 里的 `epochDay == today()`）。一份 `date` 是昨天的文件，
# 年龄再新也会被按「不是今天」判掉，界面显示「暂未取到」。
#
# 只量年龄时，看门狗**恰好每天凌晨失明**：换日之后、下一次同步之前，
# 文件年龄只有几小时（它判绿），`date` 却已经是昨天（客户端不显示）。
# 实测历史 438.7 小时 / 98 个版本里有 **40.5 小时**处于这种状态（18 段、
# 最长 4.0 小时），其中 **14.7 小时**文件年龄仍 < 3 小时 —— 那 14.7 小时
# 是「看门狗绿、界面空」的。形态很固定：`10-27 00:03 → 04:01` 这类。
#
# 这个看门狗就是那个信号：不满足就**补跑一次同步**，补完还不满足就红。
# 有了它，「3 小时 + 今天的日期」才从一句注释变成**被验证的承诺**。

on:
  schedule:
    # 每小时查两次（第 7 分、第 37 分）。
    # 间隔比同步工作流密，是为了在「刚变旧」时就发现，而不是等下一轮同步。
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # 需要它去触发 weather-sync 补跑（workflow_dispatch 不在 contents 权限里）。
  actions: write

concurrency:
  group: weather-watchdog
  # 不取消：上一次检查还没跑完就说明已经有事要查了，别把正在查的那次杀掉。
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 这份天气还能不能用
        id: check
        # 退出码非 0 = 太旧 / 不是今天的 / 读不出来。不让它直接失败，
        # 因为下面还有「补跑一次」这一步要做。
        run: python scripts/check_weather_freshness.py --max-age-hours 3
        continue-on-error: true

      - name: 不能用就补跑一次同步
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::这份天气不能用（太旧或不是今天的），触发一次 weather-sync 补跑"
          gh workflow run weather-sync.yml --ref main

      - name: 复检（最多等 5 分钟）
        if: steps.check.outcome == 'failure'
        run: |
          for i in $(seq 1 10); do
            sleep 30
            git fetch origin main --quiet
            git checkout FETCH_HEAD -- weather.json
            if python scripts/check_weather_freshness.py --max-age-hours 3; then
              echo "补跑之后已经可以用（第 ${i} 次检查）"
              exit 0
            fi
          done
          echo "::error::补跑同步之后这份天气仍然不能用（太旧或不是今天的）"
          exit 1
