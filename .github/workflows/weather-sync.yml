name: Sync Weather Data (Seniverse)

on:
  schedule:
    # **每小时试一次**（第 25 分钟，避开整点高峰）。
    #
    # ## 为什么不是「每 3 小时」
    #
    # 因为 GitHub 的定时任务在高峰期会**跳过整点**。实测 93 次调度，
    # 平均间隔 4.45 小时、最长 10.77 小时 —— 而 cron 写的是每小时一次。
    # 2026-11-03 09:40 之后连续 6 个整点全部没跑（实测）。
    #
    # **跳一个点就欠一整个间隔**：cron 写得越稀，被跳过时欠得越多。
    # 3 小时的 cron 在这种调度器下，实际间隔会奔着 6~9 小时去。
    #
    # 所以这里是**每小时试一次**，而「数据有多新」由另一个工作流看着：
    # `weather-watchdog.yml` 每半小时查一次，超过 3 小时就补跑并把结论亮出来。
    #
    # 换句话说：**每小时是尝试频率，3 小时是被看守的承诺。**
    - cron: '25 * * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行

concurrency:
  group: weather-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 必须取全量历史：checkout 默认是 depth=1 的浅克隆，
          # 从浅克隆往第二个远端推，服务端会因为拿不到完整祖先而拒收
          # （shallow update not allowed）。这份仓库很小，全量检出没有成本。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync script
        env:
          SENIVERSE_KEY: ${{ secrets.SENIVERSE_KEY }}
          WEATHER_LOCATION: "hangzhou"
          WEATHER_CITY_NAME: "杭州"
        run: |
          python scripts/sync_weather.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weather.json
          if ! git diff --staged --quiet weather.json; then
            git commit -m "chore(weather): update weather.json from Seniverse"
            git push origin main
          else
            echo "weather.json 没有变化，无需提交。"
          fi

      # 推 Gitee 镜像。这里有三个坑，都踩过：
      #
      # 1. 不能写成 `git remote set-url gitee <url>`：Actions 全新 checkout 里
      #    只有 origin 这一个 remote，set-url 对不存在的 remote 会以退出码 2
      #    失败，整条流水线直接红在这一行，镜像一个字节都没推上去。
      #    要么 `git remote add`，要么干脆不建 remote、直接推 URL —— 这里用后者。
      #
      # 2. 不能留 `|| true`：token 没配或过期时推送会失败，而失败被吞掉之后
      #    没有任何痕迹，镜像就停在旧版本上（实测滞留了 19 小时的天气数据）。
      #    宁可让这一步红，也不要在没人知道的情况下让镜像悄悄烂掉。
      #    这一步在推 origin 之后，失败也不影响 GitHub 上的天气数据本身。
      #
      # 3. **重试 + 推后回读**（2026-11-03 加）：
      #    跑这个工作流的是美国机房的 runner，而 gitee.com 在国内 ——
      #    传输层超时是常事（实测 2026-11-02 那次 exit 128，耗时 63 秒）。
      #    一次超时就让镜像滞后 7 小时（下次调度要等几小时才轮得到），代价太大。
      #    所以这里重试三次，并且**推完回读远端的 main**：它必须指到本次提交。
      #    「push 成功」只说明命令返回了 0；「远端指对了」才是镜像真的更新了。
      #    回读走的是与推送同一条链路（同一个 URL），所以它通 = 推送确实到位，
      #    不受「从美国机房能不能打开 gitee 的 raw 页面」这种跨链路差异的影响。
      - name: Push to Gitee (mirror)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -eu
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN 未配置（或为空），Gitee 镜像不会更新"
            exit 1
          fi
          GITEE_URL="https://zjuchenqianyu:${GITEE_TOKEN}@gitee.com/zjuchenqianyu/MiuList.git"
          for attempt in 1 2 3; do
            echo "第 ${attempt} 次推送 Gitee 镜像…"
            # connectTimeout 20s + 低速中止：别让一次传输卡满 63 秒再失败。
            if git -c http.connectTimeout=20 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
                 push "$GITEE_URL" main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Gitee 镜像推送重试 3 次仍失败"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          REMOTE_HEAD="$(git ls-remote "$GITEE_URL" refs/heads/main | cut -f1)"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          if [ "$REMOTE_HEAD" != "$LOCAL_HEAD" ]; then
            echo "::error::Gitee 远端 main 指向 $REMOTE_HEAD，本次提交是 $LOCAL_HEAD —— 镜像没有更新"
            exit 1
          fi
          echo "Gitee 镜像已确认指向 $LOCAL_HEAD"

      # 最后再自检一次**这份文件本身**能不能用：年龄 ≤ 3 小时，且 `date` 是今天。
      #
      # 年龄这一半在这里基本恒真（`sync_weather.py` 刚写下 `lastUpdated = now`），
      # 它挡的是 runner 时钟跑飞；**`date` 这一半是实打实的** ——
      # 心知偶尔会返回前一天的 `daily[0]`，那样推上去的文件客户端根本不会显示
      # （`cachedToday()` 按「不是今天」判掉），而上面几步全是绿的。
      - name: 自检这份文件还能不能用
        run: python scripts/check_weather_freshness.py --max-age-hours 3
